name: Build ARM64-v8a Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "KEYSTORE_BASE64 is empty. Creating signing key for release workflow."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Release Build,O=MissionGTAMobile,C=US"
          fi

      - name: Run Test Checks
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build ARM64 Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Confirm Release APK Exists
        run: |
          echo "Verifying generated release APK files:"
          ls -lh app/build/outputs/apk/release/*.apk
          test -n "$(ls -A app/build/outputs/apk/release/*.apk 2>/dev/null)"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Mobile-ARM64-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
