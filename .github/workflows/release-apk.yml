name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "KEYSTORE_BASE64 is empty. The build will produce an unsigned APK."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f my-upload-key.jks ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleRelease || echo "Release build failed, likely missing keystore. Please provide secrets."
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Mobile-release-apk
          path: app/build/outputs/apk/release/*.apk
