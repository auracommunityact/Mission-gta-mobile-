name: Build and Verify Debug APK (ARM64-v8a)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build ARM64 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Confirm APK Exists
        run: |
          echo "Verifying generated APK files:"
          ls -lh app/build/outputs/apk/debug/*.apk
          test -f app/build/outputs/apk/debug/app-debug.apk || test -n "$(ls -A app/build/outputs/apk/debug/*.apk 2>/dev/null)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Mobile-ARM64-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
